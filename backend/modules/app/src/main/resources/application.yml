spring:
  application:
    name: studymate

  datasource:
    url: jdbc:postgresql://localhost:5432/studymate
    username: postgres
    password: ${DB_PASSWORD:postgres}

  liquibase:
    change-log: classpath:db/changelog/master.yml

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: studymate-default
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual

studymate:
  kafka:
    topics:
      material-uploaded: studymate.material.uploaded
      text-extracted: studymate.material.text-extracted
      text-chunked: studymate.material.text-chunked
      chunks-embedded: studymate.material.chunks-embedded
  security:
    jwt:
      secret: ${JWT_SECRET:my-super-secret-key-that-is-at-least-32-bytes-long}
      access-token-ttl: 15m
      refresh-token-ttl: 7d
      cookie-secure: ${JWT_COOKIE_SECURE:false}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    provider: local
    local:
      base-path: storage
  ai:
    llm:
      provider: ollama   # groq | ollama | anthropic
    groq:
      base-url: https://api.groq.com/openai/v1
      api-key: ${GROQ_API_KEY:}
      default-model: llama-3.3-70b-versatile
    ollama:
      base-url: http://localhost:11434/v1
      default-model: qwen2.5:14b
    embedding:
      base-url: http://localhost:11434
      model: bge-m3
      dimensions: 1024
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      default-model: claude-sonnet-5


server:
  port: 8080

logging:
  level:
    cz.cvut.fit.studymate: DEBUG
    org.springframework.web: INFO
